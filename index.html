<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#17133a'><link rel='manifest' href='manifest.json'><title>SRB Ludo 3D</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#4b3db5 0,#211a55 35%,#0e0b25 100%);color:#fff;min-height:100vh;overflow-x:hidden}.app{max-width:720px;margin:auto;padding:18px 16px 28px}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;font-size:28px;letter-spacing:-1px}.logo span{color:#ffd34e}.pill{padding:8px 12px;border:1px solid #ffffff24;border-radius:18px;background:#ffffff12;font-size:12px}.hero{text-align:center;margin:22px 0 16px}.hero h1{font-size:34px;margin:0 0 6px}.hero p{margin:0;color:#c8c2ee}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.card{position:relative;overflow:hidden;border:1px solid #ffffff25;background:linear-gradient(145deg,#ffffff1c,#ffffff09);border-radius:24px;padding:18px;min-height:125px;box-shadow:0 18px 35px #08051b66;cursor:pointer}.card:active{transform:scale(.98)}.card strong{display:block;font-size:20px;margin-top:32px}.card small{color:#c9c3ec}.ico{position:absolute;right:12px;top:9px;font-size:46px;filter:drop-shadow(0 8px 8px #0008)}.full{grid-column:1/-1}.game{display:none}.hud{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px}.back{border:0;background:#ffffff18;color:white;border-radius:14px;padding:10px 13px}.turn{font-weight:800;background:#ffffff15;padding:10px 14px;border-radius:16px}.boardWrap{padding:9px;background:linear-gradient(145deg,#fff,#c9c6e4);border-radius:26px;box-shadow:0 25px 50px #0008, inset 0 2px 0 #fff}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);position:relative;background:#f7f4ec;border-radius:18px;overflow:hidden}.cell{border:.5px solid #403a5215;position:relative}.homeR{background:#ef4c55}.homeG{background:#31bb72}.homeY{background:#f5c743}.homeB{background:#4388ee}.path{background:#fff}.safe:after{content:'★';font-size:11px;position:absolute;inset:0;display:grid;place-items:center;color:#6c6680}.center{position:absolute;left:40%;top:40%;width:20%;height:20%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:conic-gradient(#ef4c55 0 25%,#31bb72 0 50%,#f5c743 0 75%,#4388ee 0);z-index:2}.yard{position:absolute;width:30%;height:30%;border-radius:16%;background:#fff9;box-shadow:inset 0 0 0 7px #ffffff44}.yr{left:3.3%;top:3.3%}.yg{right:3.3%;top:3.3%}.yy{right:3.3%;bottom:3.3%}.yb{left:3.3%;bottom:3.3%}.pawn{position:absolute;width:6.2%;aspect-ratio:.72;z-index:5;transition:left .22s ease,top .22s ease;filter:drop-shadow(0 5px 3px #0006);cursor:pointer}.pawn:before{content:'';position:absolute;left:10%;top:0;width:80%;height:55%;border-radius:50%;background:var(--c);box-shadow:inset 5px 6px 8px #ffffff75,inset -5px -7px 8px #0003}.pawn:after{content:'';position:absolute;left:25%;bottom:0;width:50%;height:58%;background:linear-gradient(90deg,#0002,transparent 35%,#fff5 50%,transparent 65%,#0002),var(--c);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);border-radius:4px}.pawn.sel{animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:translateY(-5px) scale(1.08)}}.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px}.dice{width:74px;height:74px;border:0;border-radius:20px;background:linear-gradient(145deg,#fff,#d8d6e4);color:#24203e;font-size:36px;font-weight:900;box-shadow:0 12px 0 #aaa7c0,0 18px 25px #0007;transition:.15s}.dice:active{transform:translateY(6px);box-shadow:0 6px 0 #aaa7c0}.dice.roll{animation:roll .5s}@keyframes roll{50%{transform:rotate(20deg) scale(.9)}}.hint{max-width:180px;color:#cbc5ed;font-size:13px}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:#111027e8;padding:12px 18px;border-radius:16px;transition:.3s;z-index:20}.toast.show{transform:translateX(-50%) translateY(0)}.win{display:none;position:fixed;inset:0;background:#090716dd;z-index:30;place-items:center}.winbox{text-align:center;background:linear-gradient(145deg,#302878,#17133e);padding:30px;border-radius:28px;width:min(88%,380px);box-shadow:0 30px 80px #000}.winbox h2{font-size:34px;margin:8px}.winbox button{border:0;border-radius:16px;padding:13px 20px;font-weight:800}.players{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 8px;border-radius:12px;background:#ffffff15}.tag.active{outline:2px solid white}.install{position:fixed;right:16px;bottom:16px;border:0;border-radius:18px;background:#ffd34e;padding:12px 15px;font-weight:900;display:none;z-index:12}@media(max-width:430px){.hero h1{font-size:29px}.boardWrap{padding:6px}.app{padding:14px 10px 24px}.modes{gap:9px}.card{padding:14px}}
</style></head><body><div class='app'><section id='menu'><div class='top'><div class='logo'>SRB <span>LUDO</span></div><div class='pill'>🎲 3D Edition</div></div><div class='hero'><h1>Roll. Race. Rule. 👑</h1><p>Quick Ludo with smooth 3D-style gameplay</p></div><div class='modes'><div class='card full' onclick="start('bot',2)"><div class='ico'>🤖</div><strong>You vs Bot</strong><small>Easy • Relaxed • Quick match</small></div><div class='card' onclick="start('local',2)"><div class='ico'>👥</div><strong>2 Players</strong><small>Pass & play</small></div><div class='card' onclick="start('local',4)"><div class='ico'>👨‍👩‍👧‍👦</div><strong>4 Players</strong><small>Classic party</small></div></div></section><section class='game' id='game'><div class='hud'><button class='back' onclick='home()'>← Home</button><div class='players' id='players'></div><div class='turn' id='turn'>Your Turn</div></div><div class='boardWrap'><div class='board' id='board'><div class='center'></div><div class='yard yr'></div><div class='yard yg'></div><div class='yard yy'></div><div class='yard yb'></div></div></div><div class='controls'><button class='dice' id='dice' onclick='roll()'>⚄</button><div class='hint' id='hint'>Tap the dice to roll. Roll 6 to bring a pawn out.</div></div></section></div><button id='install' class='install'>⬇ Install</button><div id='toast' class='toast'></div><div id='win' class='win'><div class='winbox'><div style='font-size:64px'>🏆</div><h2 id='winner'>You Win!</h2><p>Great race! Ready for another?</p><button onclick='home()'>Play Again</button></div></div><script>
const B=document.getElementById('board'), diceEl=document.getElementById('dice'); const colors=['#ef4c55','#31bb72','#f5c743','#4388ee'], names=['Red','Green','Yellow','Blue'];
// visual 15x15 ludo board
for(let r=0;r<15;r++)for(let c=0;c<15;c++){let d=document.createElement('div');d.className='cell'; if(r<6&&c<6)d.classList.add('homeR');else if(r<6&&c>8)d.classList.add('homeG');else if(r>8&&c>8)d.classList.add('homeY');else if(r>8&&c<6)d.classList.add('homeB');else d.classList.add('path'); if((r==6||r==8||c==6||c==8)&&((r+c)%5==0))d.classList.add('safe');B.appendChild(d)}
let mode='bot', count=2, turn=0, rolled=0, canRoll=true, pawns=[], activeColors=[];
const route=[]; // 52-point ring, mapped to board percent positions
for(let i=0;i<13;i++)route.push([6.5+i*6.65,43]);for(let i=0;i<13;i++)route.push([86.5,43+i*3.35]);for(let i=0;i<13;i++)route.push([86.5-i*6.65,86]);for(let i=0;i<13;i++)route.push([6.5,86-i*3.35]);
const starts=[0,13,26,39], yards=[[[10,10],[22,10],[10,23],[22,23]],[[72,10],[84,10],[72,23],[84,23]],[[72,72],[84,72],[72,85],[84,85]],[[10,72],[22,72],[10,85],[22,85]]];
function start(m,n){mode=m;count=n;activeColors=n==2?[0,2]:[0,1,2,3];document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';reset();}
function reset(){turn=0;rolled=0;canRoll=true;pawns.forEach(p=>p.el.remove());pawns=[];activeColors.forEach((col,pi)=>{for(let j=0;j<4;j++){let el=document.createElement('div');el.className='pawn';el.style.setProperty('--c',colors[col]);el.onclick=()=>movePawn(pawns.findIndex(x=>x.el===el));B.appendChild(el);pawns.push({el,col,owner:pi,pos:-1,home:j,done:false});}});render();}
function render(){pawns.forEach(p=>{let x,y;if(p.pos<0){[x,y]=yards[p.col][p.home]}else if(p.pos>=52){let k=Math.min(5,p.pos-52), end=[[43,43-k*5.5],[57+k*5.5,43],[57,57+k*5.5],[43-k*5.5,57]][p.col];[x,y]=end}else{let q=route[(starts[p.col]+p.pos)%52];[x,y]=q}p.el.style.left=x+'%';p.el.style.top=y+'%';});let who=activeColors[turn];document.getElementById('turn').textContent=(mode==='bot'&&turn===0?'Your Turn':names[who]+' Turn');document.getElementById('players').innerHTML=activeColors.map((c,i)=>`<span class="tag ${i===turn?'active':''}">${mode==='bot'&&i===1?'🤖 ':''}${names[c]}</span>`).join('');}
function roll(){if(!canRoll)return;if(mode==='bot'&&turn===1)return;doRoll(false)}
function doRoll(bot){canRoll=false;diceEl.classList.add('roll');let r;if(mode==='bot'){if(bot){r=Math.random()<.12?6:1+Math.floor(Math.random()*5)}else{let need=pawns.some(p=>p.owner===0&&p.pos<0);r=(need&&Math.random()<.48)?6:1+Math.floor(Math.random()*6)}}else r=1+Math.floor(Math.random()*6);rolled=r;setTimeout(()=>{diceEl.classList.remove('roll');diceEl.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r-1];selectable();},450)}
function selectable(){let own=pawns.map((p,i)=>[p,i]).filter(([p])=>p.owner===turn&&!p.done&&((p.pos<0&&rolled===6)||(p.pos>=0&&p.pos+rolled<=57)));pawns.forEach(p=>p.el.classList.remove('sel'));own.forEach(([p])=>p.el.classList.add('sel'));if(!own.length){toast('No move available');setTimeout(nextTurn,650);return}document.getElementById('hint').textContent=`You rolled ${rolled}. Choose a glowing pawn.`;if(mode==='bot'&&turn===1)setTimeout(()=>{let opts=own.map(x=>x[1]);movePawn(opts[Math.floor(Math.random()*opts.length)])},500)}
function movePawn(i){let p=pawns[i];if(canRoll||p.owner!==turn||p.done)return;if(!((p.pos<0&&rolled===6)||(p.pos>=0&&p.pos+rolled<=57)))return;pawns.forEach(x=>x.el.classList.remove('sel'));if(p.pos<0)p.pos=0;else p.pos+=rolled;if(p.pos===57)p.done=true;render();capture(p);if(pawns.filter(x=>x.owner===turn&&x.done).length===4){win(turn);return}let six=rolled===6;rolled=0;if(six){canRoll=true;document.getElementById('hint').textContent='Nice! Roll again.';if(mode==='bot'&&turn===1)setTimeout(()=>doRoll(true),650)}else setTimeout(nextTurn,450)}
function capture(p){if(p.pos<0||p.pos>=52)return;let abs=(starts[p.col]+p.pos)%52; pawns.forEach(o=>{if(o.owner!==p.owner&&o.pos>=0&&o.pos<52&&((starts[o.col]+o.pos)%52)===abs){o.pos=-1;toast('💥 Pawn captured!')}})}
function nextTurn(){rolled=0;turn=(turn+1)%activeColors.length;canRoll=true;render();document.getElementById('hint').textContent='Tap the dice to roll.';if(mode==='bot'&&turn===1)setTimeout(()=>doRoll(true),800)}
function win(t){document.getElementById('winner').textContent=mode==='bot'&&t===0?'You Win! 🎉':names[activeColors[t]]+' Wins!';document.getElementById('win').style.display='grid'}function home(){document.getElementById('win').style.display='none';document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block'}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('install').style.display='block'});document.getElementById('install').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;document.getElementById('install').style.display='none'}};
</script></body></html>
